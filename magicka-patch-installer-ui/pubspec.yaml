name: magicka_community_patch_installer_ui
description: Flutter Windows UI for the Magicka Community Patch installer.
publish_to: "none"

version: 0.0.12+12

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/payload/
    - assets/magicka-workshop-sidebar.png
    - assets/pjl234678.png
    - assets/PurpleHeartE54.png
    - assets/Skappnil.png
  shaders:
    - shaders/flame_button.frag
    - shaders/install_star_button.frag
    - shaders/patreon_heart_flame.frag
    - shaders/patreon_fire_sparks.frag
